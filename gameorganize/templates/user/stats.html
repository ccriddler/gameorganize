<div class="box row">
    {% for completion in stats %}
        <div class="box row">
            <a class="plainlink" href="{{url_for('user.detail', username=username, completion=completion.value)}}">{{completion.name}}</a>
            {{stats[completion]}}%
            <progress id="progress_{{completion.name}}" max="100" value="{{stats[completion]}}"></progress>
        </div>
    {% endfor %}
</div>
